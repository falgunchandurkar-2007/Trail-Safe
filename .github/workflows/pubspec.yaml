name: trailsafe
description: "Offline P2P Mesh, Satellite GPS SOS & Delay-Tolerant Emergency System"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  nearby_connections: ^4.1.2
  geolocator: ^13.0.1
  sqflite: ^2.4.1
  path: ^1.9.0
  permission_handler: ^11.3.1
  audioplayers: ^6.0.0
  flutter_vibrate: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
