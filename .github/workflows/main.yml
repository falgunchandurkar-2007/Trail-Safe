name: Build TrailSafe APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Initialize Fresh Flutter Android Project
        run: |
          mkdir -p temp_app
          cd temp_app
          flutter create --project-name=trailsafe --platforms=android .
          cp -r ../lib .
          flutter pub add flutter_bloc equatable geolocator telephony
          
          # Patch namespace and force Kotlin/Java JVM targets to match Java 11
          cat << 'EOF' >> android/build.gradle

          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty("android")) {
                      android {
                          compileSdkVersion 34
                          if (namespace == null) {
                              namespace project.group
                          }
                          compileOptions {
                              sourceCompatibility JavaVersion.VERSION_11
                              targetCompatibility JavaVersion.VERSION_11
                          }
                      }
                  }
                  tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                      kotlinOptions {
                          jvmTarget = "11"
                      }
                  }
              }
          }
          EOF

      - name: Build Release APK
        run: |
          cd temp_app
          flutter build apk --release

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: TrailSafe-Release-APK
          path: temp_app/build/app/outputs/flutter-apk/app-release.apk
