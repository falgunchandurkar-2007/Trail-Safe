name: Build TrailSafe APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Fresh Flutter Skeleton
        run: flutter create --project-name=trailsafe --platforms=android .

      - name: Add Required Dependencies
        run: |
          flutter pub add flutter_bloc equatable geolocator telephony

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: TrailSafe-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
